<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#17132b">
  <meta name="description" content="Sistema de ventas e inventario de Ferretería JyK">
  <title>Ferretería JyK · Ventas e inventario</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/app.js" type="module"></script>
</head>
<body>
  <svg class="symbol-library" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="m14 6 4 4m-6 2-8 8 2 2 8-8M9 5l4-3 8 8-3 4-2-2-2 2-5-5 2-2z"/></symbol>
    <symbol id="i-grid" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.3"/><rect x="14" y="3" width="7" height="7" rx="1.3"/><rect x="3" y="14" width="7" height="7" rx="1.3"/><rect x="14" y="14" width="7" height="7" rx="1.3"/></symbol>
    <symbol id="i-cart" viewBox="0 0 24 24"><path d="M2 3h3l2.7 12h11l2.3-8H6"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/></symbol>
    <symbol id="i-box" viewBox="0 0 24 24"><path d="m12 2 9 5v10l-9 5-9-5V7zM3 7l9 5 9-5m-9 5v10m-4.5-17.5 9 5"/></symbol>
    <symbol id="i-truck" viewBox="0 0 24 24"><path d="M3 5h12v12H3zm12 4h4l3 4v4h-7"/><circle cx="7" cy="18" r="2.2" fill="var(--icon-bg, none)"/><circle cx="18" cy="18" r="2.2" fill="var(--icon-bg, none)"/></symbol>
    <symbol id="i-chart" viewBox="0 0 24 24"><path d="M4 4v16h17M9 15v-4m5 4V7m5 8V4"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.7" cy="10.7" r="6.2"/><path d="m15.3 15.3 4.8 4.8"/></symbol>
    <symbol id="i-bell" viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-2.5 7-2.5 9h17c0-2-2.5-2-2.5-9ZM10 21h4"/></symbol>
    <symbol id="i-calendar" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4m10-4v4M3 10h18m-13 4h2m4 0h2m-8 3h2"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-minus" viewBox="0 0 24 24"><path d="M5 12h14"/></symbol>
    <symbol id="i-chevron" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-coin" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M15 8H11a2 2 0 1 0 0 4h2a2 2 0 1 1 0 4H9m3-10v2m0 8v2"/></symbol>
    <symbol id="i-receipt" viewBox="0 0 24 24"><path d="M5 3h14v18l-3-2-4 2-4-2-3 2zM9 8h6m-6 4h6m-6 4h3"/></symbol>
    <symbol id="i-warning" viewBox="0 0 24 24"><path d="M10.4 4.8a1.9 1.9 0 0 1 3.2 0l7.8 13.3a1.9 1.9 0 0 1-1.6 2.9H4.2a1.9 1.9 0 0 1-1.6-2.9zM12 9v4m0 4h.01"/></symbol>
    <symbol id="i-trend" viewBox="0 0 24 24"><path d="m3 17 6-6 4 4 7-8m-5 0h5v5"/></symbol>
    <symbol id="i-menu" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="m5 12 4 4L19 6"/></symbol>
    <symbol id="i-edit" viewBox="0 0 24 24"><path d="m14 6 4 4M4 20l5-.9L20 8l-4-4L5 15z"/></symbol>
    <symbol id="i-swap" viewBox="0 0 24 24"><path d="M4 7h15m-4-4 4 4-4 4m5 6H5m4-4-4 4 4 4"/></symbol>
    <symbol id="i-print" viewBox="0 0 24 24"><path d="M7 8V3h10v5M7 17H4V8h16v9h-3m-10-3h10v7H7zm10-3h.01"/></symbol>
    <symbol id="i-history" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 3 6.7M3 5v7h6m3-5v5l4 2"/></symbol>
    <symbol id="i-hammer" viewBox="0 0 24 24"><path d="m14 6 4 4m-6 2-8 8 2 2 8-8M9 5l4-3 8 8-3 4-2-2-2 2-5-5 2-2z"/></symbol>
    <symbol id="i-bolt" viewBox="0 0 24 24"><path d="m13 2-9 12h7l-1 8 10-12h-7z"/></symbol>
    <symbol id="i-drop" viewBox="0 0 24 24"><path d="M12 2s-6.5 7-6.5 12A6.5 6.5 0 0 0 18.5 14C18.5 9 12 2 12 2Z"/></symbol>
    <symbol id="i-brush" viewBox="0 0 24 24"><path d="M4 5h16v7H4zm3 7v3h4v6h2v-6h4v-3M8 5v4m4-4v4m4-4v4"/></symbol>
    <symbol id="i-shield" viewBox="0 0 24 24"><path d="m12 3 8 3v6c0 4-4 7-8 9-4-2-8-5-8-9V6z"/></symbol>
  </svg>
  <div class="app-shell">
    <aside id="sidebar" class="sidebar">
      <a class="brand" href="#panel"><span class="brand-mark"><svg><use href="#i-logo"/></svg></span><span><b>Ferretería JyK</b><small>Ventas e inventario</small></span></a>
      <nav class="navigation" aria-label="Navegación principal">
        <p>GENERAL</p>
        <a href="#panel"><svg><use href="#i-grid"/></svg> Panel general</a>
        <p>OPERACIÓN</p>
        <a href="#ventas"><svg><use href="#i-cart"/></svg> Ventas</a>
        <a href="#inventario"><svg><use href="#i-box"/></svg> Inventario</a>
        <a href="#proveedores"><svg><use href="#i-truck"/></svg> Proveedores</a>
        <p>ANÁLISIS</p>
        <a href="#reportes"><svg><use href="#i-chart"/></svg> Reportes</a>
      </nav>
      <div class="sidebar-foot"><span class="avatar">JK</span><span><strong>Ferretería JyK</strong><small>Datos de demostración</small></span></div>
    </aside>
    <button type="button" class="nav-overlay" aria-label="Cerrar menú" data-action="menu"></button>
    <div class="workspace">
      <header class="topbar">
        <div class="top-left">
          <button type="button" class="icon-btn mobile-menu" data-action="menu" aria-label="Abrir menú" aria-controls="sidebar" aria-expanded="false"><svg><use href="#i-menu"/></svg></button>
          <span class="breadcrumb"><span>Inicio</span><span aria-hidden="true">/</span><b id="breadcrumb">Panel general</b></span>
        </div>
        <div class="top-right">
          <button type="button" class="search-trigger" data-action="buscar"><svg><use href="#i-search"/></svg><span>Buscar producto...</span><kbd>Ctrl K</kbd></button>
          <button type="button" class="icon-btn bell-button" data-action="alertas" aria-label="Ver alertas de stock"><svg><use href="#i-bell"/></svg><span id="alert-dot" hidden></span></button>
          <span class="top-avatar" aria-label="Ferretería JyK">JK</span>
        </div>
      </header>
      <main id="main" aria-live="off"><p class="loading" role="status">Conectando con la base de datos…</p></main>
    </div>
  </div>
  <dialog id="modal" aria-labelledby="dialog-title"></dialog>
  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
